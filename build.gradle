plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    if (providers.gradleProperty('dreamTestData').isPresent()) srcDir('src/gametest/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url 'https://maven.theillusivec4.top/' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir(providers.gradleProperty('testRunRoot').getOrElse('run')).dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(project.mod_id)
        if (providers.gradleProperty('testEnergyProvider').isPresent()) systemProperty 'omnira.testEnergyProvider', 'true'
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def testModsDir = providers.gradleProperty('testModsDir').getOrElse('../.minecraft/versions/WizardryCraft/mods')
def installedCreate = file("$testModsDir/create-1.21.1-6.0.10.jar")
def installedSable = file("$testModsDir/sable-neoforge-1.21.1-2.0.6.jar")
def installedJei = file("$testModsDir/jei-1.21.1-neoforge-19.70.0.469.jar")
def extractSableLibraries = tasks.register('extractSableLibraries', Sync) {
    from(zipTree(installedSable)) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('sable-libs')
}
def extractCreateLibraries = tasks.register('extractCreateLibraries', Sync) {
    from(zipTree(installedCreate)) {
        include 'META-INF/jarjar/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('create-libs')
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    if (providers.gradleProperty('compatTestJar').isPresent()) localRuntime files(providers.gradleProperty('compatTestJar').get())
    compileOnly files(installedCreate)
    compileOnly files(installedSable)
    if (!providers.gradleProperty('withoutSable').isPresent() && !providers.gradleProperty('withoutCreate').isPresent()) {
        localRuntime files(installedSable)
        localRuntime files("$testModsDir/create-aeronautics-bundled-1.21.1-1.3.2.jar")
    }
    compileOnly files(fileTree('build/sable-libs') { include '*.jar' }).builtBy(extractSableLibraries)
    if (!providers.gradleProperty('withoutCreate').isPresent()) localRuntime files(installedCreate)
    compileOnly files(installedJei)
    compileOnly files(fileTree(testModsDir) { include 'lootr-*.jar' })
    if (providers.gradleProperty('withLootr').isPresent()) localRuntime files(fileTree(testModsDir) { include 'lootr-*.jar' })
    compileOnly files("$testModsDir/Jade-1.21.1-NeoForge-15.10.6.jar")
    if (!providers.gradleProperty('withoutJei').isPresent())
        localRuntime files(installedJei)
    // Nested Create libraries are supplied by Create in production.
    compileOnly files(fileTree('build/create-libs') { include '*.jar' }).builtBy(extractCreateLibraries)
    def installedCurios = file("$testModsDir/curios-neoforge-9.5.1+1.21.1.jar")
    if (installedCurios.exists()) implementation files(installedCurios)
    else implementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    def localTestMods = file('config/development-mods.local.json')
    if (!providers.gradleProperty('withoutExternalMods').isPresent() && localTestMods.isFile()) {
        def snapshot = new groovy.json.JsonSlurper().parse(localTestMods)
        snapshot.server.each { name ->
            if (name.startsWith('kubejs-create-') && providers.gradleProperty('withoutCreate').isPresent()) return
            def installed = file("$testModsDir/$name")
            if (!installed.isFile()) throw new GradleException("External test mod missing: $name; refresh config/development-mods.local.json against the installed instance.")
            localRuntime files(installed)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('prepareSpellGameTests', Copy) {
    from('scripts/tests/spell_arena.snbt')
    into(layout.projectDirectory.dir(providers.gradleProperty('testRunRoot').getOrElse('run')).dir('gameTestServer/gameteststructures'))
}

tasks.configureEach {
    if (name == 'runGameTestServer') dependsOn('prepareSpellGameTests')
}

if (providers.gradleProperty('kubejsRecipeTest').isPresent()) {
    if (providers.gradleProperty('withoutExternalMods').isPresent())
        throw new GradleException('kubejsRecipeTest requires the installed KubeJS test runtime.')
    def fixture = layout.projectDirectory.dir(providers.gradleProperty('testRunRoot').getOrElse('run')).file('gameTestServer/kubejs/server_scripts/omnira_recipe_smoke.js')
    tasks.register('prepareKubeRecipeTest', Copy) {
        from('scripts/tests/omnira_recipe_smoke.js')
        into(fixture.asFile.parentFile)
    }
    tasks.register('cleanKubeRecipeTest', Delete) { delete(fixture) }
    tasks.configureEach {
        if (name == 'runGameTestServer') {
            dependsOn('prepareKubeRecipeTest')
            finalizedBy('cleanKubeRecipeTest')
        }
    }
}

tasks.named('jar').configure {
    from('LICENSE') { into('META-INF') }
    exclude('**/.gitkeep')
    exclude('com/mcmagic/omnira/gametest/**')
    exclude('com/mcmagic/omnira/**/*GameTests*.class')
    exclude('com/mcmagic/omnira/client/renderer/CruiseOrbRenderer$GeometryVerification*')
    exclude('com/mcmagic/omnira/client/ArmorPreview*')
    exclude('com/mcmagic/omnira/client/SpacetimeSkyPreview*')
    exclude('com/mcmagic/omnira/client/codex/CodexOfflinePreview*')
    exclude('data/minecraft/worldgen/world_preset/flat.json')
    exclude('data/lootr_test/**')
}

def localVisualChecks = file('scripts/visual-checks.local.gradle')
if (localVisualChecks.isFile()) apply from: localVisualChecks

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
